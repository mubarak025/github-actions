
#uses trivy to scan the docker image for vulnerabilities
name: image scan
on:
    workflow_call:

jobs:
    image-scanner:
        runs-on: ubuntu-latest

        steps:
          - name: checkout code
            uses: actions/checkout@v4
            
          - name: docker login
            uses: docker/login-action@v3
            with:
             username: ${{ vars.DOCKERHUB_USER }}
             password: ${{ secrets.DOCKERHUB_TOKEN }} 

          - name: trivy scan
            uses: aquasecurity/trivy-action@v0.4.0
            with:
              with-ref: '${{ vars.DOCKERHUB_USER }}/github-action-app:latest'
              severity: 'CRITICAL'
              exit-code: "1"