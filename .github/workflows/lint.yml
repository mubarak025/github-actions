# The lint is used to check whether the syntax, format, and indentation (linting ) are correct or not  

name: auto linter

on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: checkout/ clone the code 
        uses: actions/checkout@v7
        
      - name: install linter
        run: pip install ruff


    
