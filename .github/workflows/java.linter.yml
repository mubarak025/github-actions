name: Java Linter

# on:
 # workflow_dispatch
#  push:
#    paths:
#      - "**/*.java"
#     - "pom.xml"

  pull_request:
    paths:
      - "**/*.java"
      - "pom.xml"

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Java version
        run: java -version

      - name: Run Maven Checkstyle
        run: mvn checkstyle:check




     