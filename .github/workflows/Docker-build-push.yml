name: Docker build and push
# Docker build and push workflow for GitHub Actions
on: 

  push:
    branches:
      - main
jobs:
    build-and-push:
      runs-on: ubuntu-latest

      steps:
       - name: checkout code
         uses: actions/checkout@v7

       - name: docker login
         uses: docker/login-action@v3
         with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  

          
       - name: Check Docker Username
         run: |
           echo "Docker Username: ${{ vars.DOCKER_USER }}"

       - name: build and push docker hub
         uses: docker/build-push-action@v6
         with:
          context: .
          push: true
          tags: |
            ${{vars.DOCKER_USER}}/github-actions-app:${{github.ref_name}}
            ${{vars.DOCKER_USER}}/github-actions-app:latest
            ${{vars.DOCKER_USER}}/github-actions-app:${{github.sha}}




