name: Python lint

on:
  push: 
    branches: [main]

jobs:
    validate:
        run-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v7
        
            - name: setup python
              uses: actions/setup-python@v4
              with:
                 python-version: "3.14"
             name: install dependencies
             run: pip install -r requirements.txt

             name: run linter
             run: flake8 app.py




            



  
