name: deploy flask app

on:
  workflow_dispatch:

jobs:
    
    deploy:
        runs-on: self-hosted

    
        steps:
         - name: checkout code
           uses: actions/checkout@v4

         - name: deploy with docker compose
           env:
            DOCKERHUB_USER: ${{vars.DOCKERHUB_USER}}
           run: docker compose up -d --build 
         
