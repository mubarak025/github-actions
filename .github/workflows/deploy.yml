name: deploy flask app

on:
  workflow_dispatch:

jobs:
    
    deploy:
        runs-on: self-hosted
        env:
           DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
        

        steps:
         - name: checkout code
           uses: actions/checkout@v7


         - name: Debug Docker Compose
           run: |
            echo "Checking Compose files..."
            find . -type f \( -name '*compose*.yml' -o -name '*compose*.yaml' \)

            echo "Checking incorrect variable..."
            grep -Rn "vars.DOCKERHUB_USER" . --exclude-dir=.git || true

            echo "Printing docker-compose.yml..."
            cat docker-compose.yml


         - name: deploy with docker compose
           run: docker compose up -d --build 
