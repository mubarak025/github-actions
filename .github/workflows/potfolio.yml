name : potfolio

on: 
  workflow_dispatch
#  push:
#    branches: [main]

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment

permissions:
  pages: write      
  id-token: write  

jobs: 
    deploy:
      runs-on: ubuntu-latest

      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

      steps: 
        # get access to your portfolio code via pre-build action
        - name: checkout code
          uses: actions/checkout@v7

        # setup github page
        - name: upload the static file 
          id: pages
          uses: actions/configure-pages@v6
           

        # statice code artifacts
        - name: upload static files
          uses : actions/upload-pages-artifact@v4
          with: 
              path: "."

        # deploy to action github page

        - name: deploy to github pages
          uses: actions/deploy-pages@v4


