# scan the Dcoekrfile for issue & vulnerabilities
name: Dockerfile Lint

on:
    workflow_call:

jobs:
    validate-dockerfile:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: validate the dockerfile
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dockerfile: Dockerfile




        