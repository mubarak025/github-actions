name: CICD

on:
  workflow_dispatch: 
   inputs:
     environment:
        description: This is the environment value where this workflow runs
        default: "dev"
        required: true
        type: choice
        options:
         - dev
         - staging
         - prod 
         
       
    

jobs:
  code:
    runs-on:  ubuntu-latest
    steps:
      - name: clone the code
        run: echo "cloning the code"

  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: build the code
        run: echo "building using Docker"

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps: 
    - name: Running test case
      run: echo "testing the app"

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying on server
        run: echo "Deploying the code to the server"

  
        
      
