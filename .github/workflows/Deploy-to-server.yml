# this will deploy the code to the server using ssh and rsync
name: Deploy to server

on:
    workflow_call:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4

        
            - name: SSH to prod server and create app foler 
              uses: appleboy/ssh-action@v0.1.6
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                script: |
                  echo" startaing deployment"
                  mkdir -p devops
            
            - name: copy docker compose file
              uses: appleboy/scp-action@v0.1.6
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                source: "docker-compose.yml"
                target: "~/devops/docker-compose.yml"

            - name: SSH to prod server and run the app
              uses: appleboy/ssh-action@v0.1.6
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                script: |
                  echo  " running the app"
                  sudo apt-get update
                  sudo apt-get install docker.io docker-compose-v2 -y
                  sudo usermod -aG docker $USER && newgrp docker
                  export DOCKERHUB_USER=${{ vars.DOCKERHUB_USER }}
                  export DOCKE_TAG=${{ github.event.workflow_run.head_sha }}
                  export DOCKER_TAG=${{ github.sha }}
                  export ${{ github.sha }}
                  echo ${{secrets.DOCKERHUB_TOKEN}} | docker login -u ${{vars.DOCKERHUB_USER}} --password-stdin
                  cd ~/devops && docker compose down && docker compose up -d --build

            

