
name: Deploy to server

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Create application folder on EC2
      - name: Create app folder
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Starting deployment"
            mkdir -p "$HOME/devops"
            ls -ld "$HOME/devops"

      # Step 3: Copy Docker Compose file to EC2
      - name: Copy Docker Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_SSH_USER }}/devops/"

      # Step 4: Install Docker and deploy application
      - name: Run application on EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: DOCKERHUB_USER,DOCKERHUB_TOKEN
          script: |
            set -e

            echo "Installing Docker if required"

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2
            fi

            sudo systemctl enable --now docker

            echo "Logging into Docker Hub"

            echo "$DOCKERHUB_TOKEN" | sudo docker login \
              -u "$DOCKERHUB_USER" --password-stdin

            echo "Deploying application"

            cd "$HOME/devops"

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans

            echo "Running containers"
            sudo docker ps

            echo "Deployment completed successfully"

            

